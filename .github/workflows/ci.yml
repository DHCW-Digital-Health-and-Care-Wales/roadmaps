# CI for pull requests and main; deploys the editor from main to GitHub Pages once every
# check passes (ADR-007), and checks the public site, which product-roadmaps publishes
# from main, and the API. The Repository job runs every time, Dependency review on all
# but a push to main, each app's jobs when the app can be affected, and CI result, the
# one check main's ruleset requires, fails when any of them fails
# (.github/rulesets/main.json). Actions are pinned to commit SHAs; Dependabot keeps them
# current.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new PR push cancels the PR's running checks. On main a running workflow is never
  # cancelled; a newer push replaces a still-pending one, so the latest commit deploys
  # and deployments stay in commit order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The editor's base path (apps/editor/build/resolve-base-path.ts): GitHub Actions sets
  # GITHUB_REPOSITORY, so every build here, E2E included, is served under /<repo>/ unless
  # this repository variable names a custom domain.
  PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}

jobs:
  # Picks the app jobs a pull request runs: an app's jobs skip only when no changed file
  # can affect it (scripts/ci/classify-changes.sh). Pushes to main and manual runs run
  # every job, since they build what deploys.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      editor: ${{ steps.classify.outputs.editor }}
      site: ${{ steps.classify.outputs.site }}
      api: ${{ steps.classify.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - name: Classify the changed files
        id: classify
        # bash, not the default `bash -e`, adds pipefail, so a failing classifier fails
        # the job rather than leaving tee's success and no output.
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            scripts/ci/classify-changes.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists a moved file's old path too, so code moved into docs/ counts.
          changed="$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)"
          echo "Changed files:"
          echo "$changed"
          printf '%s\n' "$changed" | scripts/ci/classify-changes.sh | tee -a "$GITHUB_OUTPUT"

  # The checks of the repository as a whole, on every run: formatting, the root
  # package's own code and tests (the Markdown links, the agent-guide budget, the
  # worktree and CI scripts, and that CI result needs every job), the skills' script
  # tests, knip, the API's generated package and the workflows.
  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm repo:typecheck
      - run: pnpm repo:lint
      - run: pnpm repo:test
      # The node --test suites of the skills' scripts. The UX prototypes' open
      # Chromium: the runner's Chrome, as the Lighthouse job uses, so no browser is
      # installed. The pattern is quoted, so node expands it: a new suite runs unlisted.
      - name: Test the skills' scripts
        run: node --test '.agents/skills/*/scripts/*.test.mjs'
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      # Unused files, exports and dependencies across the pnpm workspace (knip.jsonc).
      - run: pnpm knip
      # The API's generated package: its types, its lint, its tests and, against
      # apps/api/openapi.json, any drift in what it commits; API: verify holds that
      # document to the code.
      - run: pnpm api-types:typecheck
      - run: pnpm api-types:lint
      - run: pnpm api-types:test
      - run: pnpm api-types:check
      # Pinned by version and checksum; actionlint runs shellcheck on each run: block.
      - name: Lint the workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          ./actionlint -color
      # Every audit, pedantic ones included; a finding is fixed or justified inline with
      # a `zizmor: ignore[<audit>]` comment where it is raised.
      - name: Audit the workflows and Dependabot with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          persona: auditor
          advanced-security: false

  # A pull request that adds or changes a dependency to a version with a known
  # vulnerability fails, development dependencies included, since CI and every
  # developer's machine run them (CHO-031 S2). It reads GitHub's dependency graph of the
  # base and the head, so it checks out nothing. A manual run compares its commit with
  # main, so its CI result is no weaker than a pull request's on the same commit; a push
  # to main skips it, and a vulnerability disclosed in a merged dependency is the
  # dependency audit's (.github/workflows/dependency-audit.yml).
  dependency-review:
    name: Dependency review
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-scopes: runtime, development, unknown
          # Read only off pull_request events, where the action takes the pull request's.
          base-ref: main
          head-ref: ${{ github.sha }}

  editor-verify:
    name: "Editor: verify"
    needs: changes
    # Skips only on an explicit false, so a missing output runs the job.
    if: needs.changes.outputs.editor != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the site's URL
    outputs:
      pages-artifact: ${{ steps.pages-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm editor:typecheck
      - run: pnpm editor:lint
      - run: pnpm editor:test
      - run: pnpm editor:build

      # Pages artifact, for pushes to main only. The deploy job runs no project code.
      - name: Read the Pages site configuration
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Check the build matches the Pages base path
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          expected="${PAGES_BASE_PATH}/assets/"
          if ! grep -qF "src=\"${expected}" apps/editor/dist/index.html; then
            echo "::error title=Base path mismatch::GitHub Pages serves this site from '${PAGES_BASE_PATH}/', but the build does not load its assets from '${expected}'. For a custom domain, set the PAGES_CUSTOM_DOMAIN repository variable (see docs/operations/github-pages-deployment.md)."
            exit 1
          fi
      # Named per attempt: deploy-pages refuses to choose between same-named artifacts,
      # which a re-run would otherwise leave behind.
      - name: Name the Pages artifact
        id: pages-artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "name=github-pages-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: apps/editor/dist

  editor-e2e:
    name: "Editor: E2E (Playwright)"
    needs: changes
    # Skips only on an explicit false, so a missing output runs the job.
    if: needs.changes.outputs.editor != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image holds the Chromium and the system packages of one Playwright
    # version, so the job installs neither and waits on no apt mirror (CHO-029). Pinned by
    # digest, like the actions. A bump of @playwright/test changes the tag and digest
    # here and in site-e2e: the check below fails the job, naming the version, when the
    # image lacks its Chromium, before the build and the tests would fail on it. Find the
    # digest with:
    # docker pull mcr.microsoft.com/playwright:v<version>-noble
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      # Playwright's guidance for Chromium in a container: share the host's IPC
      # namespace, or a heavy page can crash the renderer.
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the container has the Playwright browser
        working-directory: apps/editor
        run: |
          node -e "
            const { chromium } = require('@playwright/test');
            const { version } = require('@playwright/test/package.json');
            chromium.launch().then((browser) => browser.close()).catch((error) => {
              console.error(error.message);
              console.error('::error::Update the Playwright image tag and digest in .github/workflows/ci.yml to v' + version + '.');
              process.exit(1);
            });
          "

      # The Playwright web server builds the editor and serves it with `vite preview`.
      - run: pnpm editor:test:e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: |
            apps/editor/playwright-report/
            apps/editor/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The public site (apps/public-site), checked here and published by product-roadmaps'
  # deploy from main (ADR-016, The public site). It builds from the example data in
  # e2e/fixtures/roadmaps.json, so a pull request never depends on the live sheet.
  site-verify:
    name: "Public site: verify"
    needs: changes
    # Skips only on an explicit false, so a missing output runs the job.
    if: needs.changes.outputs.site != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:typecheck
      - run: pnpm site:lint
      - run: pnpm site:test
      - run: pnpm site:build
        env:
          ROADMAPS_DATA: e2e/fixtures/roadmaps.json

  site-e2e:
    name: "Public site: E2E (Playwright)"
    needs: changes
    # Skips only on an explicit false, so a missing output runs the job.
    if: needs.changes.outputs.site != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The editor's E2E image, as both apps take @playwright/test from the catalog;
    # build/ci-workflow.test.ts holds the two to one tag and digest.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the container has the Playwright browser
        working-directory: apps/public-site
        run: |
          node -e "
            const { chromium } = require('@playwright/test');
            const { version } = require('@playwright/test/package.json');
            chromium.launch().then((browser) => browser.close()).catch((error) => {
              console.error(error.message);
              console.error('::error::Update the Playwright image tag and digest in .github/workflows/ci.yml to v' + version + '.');
              process.exit(1);
            });
          "

      # The Playwright web server builds the example data and serves it with
      # `vite preview`.
      - run: pnpm site:test:e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-playwright-report-attempt-${{ github.run_attempt }}
          path: |
            apps/public-site/playwright-report/
            apps/public-site/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Score thresholds and size budgets (apps/public-site/lighthouserc.json), with the
  # runner's Chrome.
  site-lighthouse:
    name: "Public site: Lighthouse"
    needs: changes
    # Skips only on an explicit false, so a missing output runs the job.
    if: needs.changes.outputs.site != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:lighthouse
      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-lighthouse-reports-attempt-${{ github.run_attempt }}
          path: apps/public-site/.lighthouseci
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  # The API (apps/api): ruff, import-linter, the transaction check, ty, drift in its
  # committed OpenAPI document and pytest at 100% branch coverage, through its pnpm
  # scripts, which run uv. pnpm api:test starts the
  # database of apps/api/compose.yaml, as it does locally, in the runner's Docker.
  api-verify:
    name: "API: verify"
    needs: changes
    # Skips only on an explicit false, so a missing output runs the job.
    if: needs.changes.outputs.api != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The uv version apps/api/pyproject.toml pins (required-version), which fetches the
      # Python of apps/api/.python-version.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: apps/api
      - run: pnpm api:lint
      - run: pnpm api:typecheck
      - run: pnpm api:openapi:check
      - run: pnpm api:test

  # The one check main's ruleset requires. It needs every job but deploy, runs whatever
  # they did, and fails when any failed or was cancelled; a job skipped by its paths or
  # its event passes, as no job would if the ruleset required each by name (STY-087 D5).
  # build/ci-workflow.test.ts fails when a job is missing from needs.
  ci-result:
    name: CI result
    needs:
      - changes
      - repository
      - dependency-review
      - editor-verify
      - editor-e2e
      - site-verify
      - site-e2e
      - site-lighthouse
      - api-verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$RESULTS")"
          if [ -n "$failed" ]; then
            echo "::error title=CI failed::${failed//$'\n'/, }"
            exit 1
          fi
          echo "Every job passed or was skipped."

  deploy:
    name: Deploy to GitHub Pages
    # Runs once CI result has passed, and with it every check. The condition names each
    # result it needs: without a status function, GitHub's implicit success() would skip
    # deploy whenever a job before it skipped, as Dependency review does on every push to
    # main (DEF-031). build/ci-workflow.test.ts holds it to that.
    needs: [editor-verify, ci-result]
    if: >-
      !cancelled()
      && needs.editor-verify.result == 'success'
      && needs.ci-result.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy-pages publishes the site
      id-token: write # deploy-pages proves the run's identity to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy the artifact uploaded by the editor's verify job
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.editor-verify.outputs.pages-artifact }}
