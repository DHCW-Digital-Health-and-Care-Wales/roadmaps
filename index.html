<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse your product roadmaps from a connected Google account."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Product Roadmaps</title>
    <script>
      // Applies the stored theme before first paint, so dark mode never flashes light.
      // Mirrors src/components/theme/theme-preference.ts (key and values).
      try {
        if (localStorage.getItem("roadmaps.theme") === "dark") {
          document.documentElement.classList.add("dark")
        }
      } catch {
        // Storage unavailable: keep the light default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
