packages:
  - apps/*

# A version more than one package uses is named once here and referenced as `catalog:`
# (ADR-016 Workspace tooling).
catalog:
  "@eslint/js": ^10.0.1
  "@types/node": ^22.20.5
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.14.0
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  vitest: ^5.1.0

# minimatch below 11.0.1 has a denial of service through glob patterns
# (GHSA-g3hv-75wg-m249). These dependents have no release that takes minimatch 11, or
# none a week old yet, so each is raised to it here; drop an entry once the dependent's
# own range takes it (Dependabot's monthly pnpm update proposes such a release).
overrides:
  # typescript-eslint 8.73.0 takes it, but was published 2026-11-16, under the week a
  # new version waits (CHO-031's minimumReleaseAge). Drop when the catalog entry above
  # moves to ^8.73.0.
  "@typescript-eslint/typescript-estree>minimatch": ^11.0.1
  # Drop when a release of eslint-plugin-jsx-a11y-x after 0.2.0 takes minimatch 11.
  "eslint-plugin-jsx-a11y-x>minimatch": ^11.0.1
  # Under shadcn's ts-morph 26. Drop when shadcn takes ts-morph 28 or later.
  "@ts-morph/common>minimatch": ^11.0.1

# A version published less than a week ago is neither resolved nor installed from the
# lockfile, CI's frozen install included, as Dependabot's cooldown holds back its
# proposals (.github/dependabot.yml), so a compromised release is usually found and
# pulled first (CHO-031 S4). To take a security fix younger than that, Dependabot's
# among them, list it in minimumReleaseAgeExclude as <name>@<version>, with each young
# package it brings, and remove the entries once they are a week old.
minimumReleaseAge: 10080 # minutes

# Dependencies whose install scripts may run. lefthook's is denied: pnpm runs it only
# when it first builds the package on a machine, so the root package's postinstall runs
# it instead, on every install, to install the Git hooks (lefthook.yml); it skips
# itself in CI.
allowBuilds:
  lefthook: false
