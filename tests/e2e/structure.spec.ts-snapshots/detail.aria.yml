        - link "Not doing, 1 item":
          - /url: /#/roadmaps/producta
  - status
  - heading "Recently delivered" [level=2]
  - list "Recently delivered":
    - listitem:
      - heading "Recently shipped work" [level=3]
      - term: Description
      - definition: Something we shipped in the last few weeks.
      - term: Expected outcome
      - definition: What users can do now.
      - term: Organisations
      - definition: Swansea Bay
      - button "Remove Recently shipped work"
      - button "Move Recently shipped work"
      - button "Edit Recently shipped work"
  - heading "Now" [level=2]
  - list "Now":
    - listitem:
      - heading "Example card with every column" [level=3]
      - term: Phase
      - definition: Beta
      - term: Description
      - definition: What this work is. Keep it to a sentence or two.
      - term: Expected outcome
      - definition: What changes for users when it is done.
      - term: Tags
      - definition: Service X, Service Y
      - term: Organisations
      - definition: Cardiff and Vale, Swansea Bay
      - term: Details
      - definition:
        - list:
          - listitem:
            - text: First bullet point
            - list:
              - listitem:
                - text: Start a line with "-" to nest it under the line above
                - list:
                  - listitem: Use two dashes to nest it again
          - listitem: Another top-level bullet point
        - button "Show more of the details of Example card with every column"
      - button "Remove Example card with every column"
      - button "Move Example card with every column"
      - button "Edit Example card with every column"
    - listitem:
      - heading "Minimal card" [level=3]
      - term: Description
      - definition: Only Title and Horizon are required; everything else is optional.
      - button "Remove Minimal card"
      - button "Move Minimal card"
      - button "Edit Minimal card"
    - listitem:
      - heading "Card awaiting release" [level=3]
      - term: Description
      - definition: Work that is finished and waiting to go live.
      - term: Expected outcome
      - definition: Users get the change as soon as it is deployed.
      - term: Tags
      - definition: Service X
      - term: Organisations
      - definition: All Wales
      - button "Remove Card awaiting release"
      - button "Move Card awaiting release"
      - button "Edit Card awaiting release"
  - heading "Next" [level=2]
  - list "Next":
    - listitem:
      - heading "Card being explored" [level=3]
      - term: Phase
      - definition: Alpha
      - term: Description
      - definition: Work we expect to pick up soon.
      - term: Expected outcome
      - definition: What we hope this will achieve.
      - term: Organisations
      - definition: Betsi Cadwaladr, Hywel Dda
      - button "Remove Card being explored"
      - button "Move Card being explored"
      - button "Edit Card being explored"
  - heading "Later" [level=2]
  - list "Later":
    - listitem:
      - heading "Discovery card" [level=3]
      - term: Phase
      - definition: Discovery
      - term: Description
      - definition: The Phase column is a free-text tag shown above the title.
      - term: Expected outcome
      - definition: A clear understanding of the problem.
      - term: Organisations
      - definition: Cardiff and Vale
      - button "Remove Discovery card"
      - button "Move Discovery card"
      - button "Edit Discovery card"
    - listitem:
      - heading "Longer-term idea" [level=3]
      - term: Description
      - definition: Direction we expect to take as we learn more.
      - term: Tags
      - definition: Service Y, Service Z
      - term: Organisations
      - definition: All Wales
      - button "Remove Longer-term idea"
      - button "Move Longer-term idea"
      - button "Edit Longer-term idea"
  - heading "Delivered this year" [level=2]
  - list "Delivered this year":
    - listitem:
      - heading "Earlier delivery this year" [level=3]
      - term: Phase
      - definition: Live
      - term: Description
      - definition: Something we delivered earlier in the year.
      - term: Organisations
      - definition: All Wales
      - term: Details
      - definition:
        - list:
          - listitem: What it included
          - listitem: Another thing it included
      - button "Remove Earlier delivery this year"
      - button "Move Earlier delivery this year"
      - button "Edit Earlier delivery this year"
  - heading "Not doing" [level=2]
  - list "Not doing":
    - listitem:
      - heading "Something we are not doing" [level=3]
      - term: Description
      - definition: Explain why this is out of scope for now.
      - button "Remove Something we are not doing"
      - button "Move Something we are not doing"
      - button "Edit Something we are not doing"