- dialog "Edit this item":
  - heading "Edit this item" [level=2]
  - form "Edit this item":
    - text: Title
    - paragraph: "Error: Enter a title"
    - textbox "Title" [invalid]
    - text: Description
    - textbox "Description": What this work is. Keep it to a sentence or two.
    - text: Expected outcome
    - textbox "Expected outcome": What changes for users when it is done.
    - text: Phase
    - textbox "Phase": Beta
    - text: Horizon or section
    - combobox "Horizon or section":
      - option "Recently delivered"
      - option "Now" [selected]
      - option "Next"
      - option "Later"
      - option "Delivered this year"
      - option "Not doing"
    - paragraph: Tags
    - list:
      - listitem: Service X
      - listitem: Service Y
    - paragraph: These tags have Welsh versions, so they can't be changed here yet.
    - paragraph: Organisations
    - button "Close organisations" [expanded]
    - group "Organisations":
      - checkbox "All Wales (National)"
      - text: All Wales (National)
      - checkbox "Aneurin Bevan (ABUHB)"
      - text: Aneurin Bevan (ABUHB)
      - checkbox "Betsi Cadwaladr (BCUHB)"
      - text: Betsi Cadwaladr (BCUHB)
      - checkbox "Cardiff and Vale (CAVUHB)" [checked]
      - text: Cardiff and Vale (CAVUHB)
      - checkbox "Cwm Taf Morgannwg (CTMUHB)"
      - text: Cwm Taf Morgannwg (CTMUHB)
      - checkbox "Digital Health and Care Wales (DHCW)"
      - text: Digital Health and Care Wales (DHCW)
      - checkbox "Health Education and Improvement Wales (HEIW)"
      - text: Health Education and Improvement Wales (HEIW)
      - checkbox "Hywel Dda (HDUHB)"
      - text: Hywel Dda (HDUHB)
      - checkbox "Performance and Improvement (P&I)"
      - text: Performance and Improvement (P&I)
      - checkbox "Powys (PTHB)"
      - text: Powys (PTHB)
      - checkbox "Public Health Wales (PHW)"
      - text: Public Health Wales (PHW)
      - checkbox "Swansea Bay (SBUHB)" [checked]
      - text: Swansea Bay (SBUHB)
      - checkbox "Velindre (VUNHST)"
      - text: Velindre (VUNHST)
      - checkbox "Welsh Ambulance (WAST)"
      - text: Welsh Ambulance (WAST)
    - paragraph: Details
    - list:
      - listitem:
        - text: First bullet point
        - list:
          - listitem:
            - text: Start a line with "-" to nest it under the line above
            - list:
              - listitem: Use two dashes to nest it again
      - listitem: Another top-level bullet point
    - paragraph: These details have Welsh versions, so they can't be changed here yet.
    - button "Done"
    - button "Cancel"
  - button "Close"