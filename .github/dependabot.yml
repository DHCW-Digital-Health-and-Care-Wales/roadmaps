# Keeps the SHA-pinned actions in .github/workflows, the workspace's pnpm dependencies
# and the API's uv dependencies and database image current: one grouped pull request a
# month for each. Every entry waits out a cooldown, so it proposes a version only once
# that is a week old (STY-087 D10, D12); pnpm's minimumReleaseAge (pnpm-workspace.yaml)
# holds the transitive versions it resolves beneath one for as long (CHO-031 S4), as
# uv's exclude-newer does for the API's (apps/api/pyproject.toml).
# The cooldown does not hold back Dependabot's security updates, a repository setting
# that is on (CHO-031 S5), but pnpm's minimumReleaseAge does: a security update younger
# than a week fails CI's install until its versions are excluded there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # pnpm's ecosystem is npm's; the root covers every package in the workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pnpm:
        patterns: ["*"]
        # Its own pull request: a bump also needs the E2E jobs' image tag and digest in
        # ci.yml, which their check steps ask for, so it cannot hold up the rest.
        exclude-patterns: ["@playwright/test"]

  # The API's uv project; ruff and ty are pinned exactly there, so their bumps come here
  # too, each a deliberate change with its fixes (ADR-017 Tooling).
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]

  # The API's database image, pinned by digest in apps/api/compose.yaml, which CI's API
  # job starts as pnpm api:test does locally, so this entry's pull request is the whole
  # update.
  - package-ecosystem: docker-compose
    directory: /apps/api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      postgres:
        patterns: ["*"]
    # PostgreSQL's major version is ADR-015's and ADR-017's decision, so only 18's
    # digest is refreshed here.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
