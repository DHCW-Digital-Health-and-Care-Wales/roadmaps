# CI for pull requests and main; deploys main to GitHub Pages once every check passes
# (ADR-007). Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new PR push cancels the PR's running checks. On main a running workflow is never
  # cancelled; a newer push replaces a still-pending one, so the latest commit deploys
  # and deployments stay in commit order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Base path (build/resolve-base-path.ts): GitHub Actions sets GITHUB_REPOSITORY, so
  # every build here, E2E included, is served under /<repo>/ unless this repository
  # variable names a custom domain.
  PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}

jobs:
  # A pull request that changes only documentation (any Markdown file, or anything under
  # docs/) runs the Docs job instead of Verify and E2E. Pushes to main and manual runs
  # always run the full suite, since they build what deploys.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - name: Classify the changed files
        id: classify
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists a moved file's old path too, so code moved into docs/ counts.
          changed="$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)"
          echo "Changed files:"
          echo "$changed"
          # grep exits 1 when every file is docs; any other failure fails the job.
          non_docs="$(printf '%s\n' "$changed" | { grep -vE '^docs/|\.md$' || [ $? -eq 1 ]; })"
          if [ -n "$non_docs" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only: skipping Verify and E2E."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # test:docs lists every test that reads Markdown; a new one joins it.
      - run: pnpm test:docs

  verify:
    name: Verify
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the site's URL
    outputs:
      pages-artifact: ${{ steps.pages-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

      # Pages artifact, for pushes to main only. The deploy job runs no project code.
      - name: Read the Pages site configuration
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Check the build matches the Pages base path
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          expected="${PAGES_BASE_PATH}/assets/"
          if ! grep -qF "src=\"${expected}" dist/index.html; then
            echo "::error title=Base path mismatch::GitHub Pages serves this site from '${PAGES_BASE_PATH}/', but the build does not load its assets from '${expected}'. For a custom domain, set the PAGES_CUSTOM_DOMAIN repository variable (see docs/operations/github-pages-deployment.md)."
            exit 1
          fi
      # Named per attempt: deploy-pages refuses to choose between same-named artifacts,
      # which a re-run would otherwise leave behind.
      - name: Name the Pages artifact
        id: pages-artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "name=github-pages-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: dist

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image holds the Chromium and the system packages of one Playwright
    # version, so the job installs neither and waits on no apt mirror (CHO-029). Pinned by
    # digest, like the actions. A bump of @playwright/test changes the tag and digest
    # too: the check below fails the job, naming the version, when the image lacks its
    # Chromium. Find the digest with: docker pull mcr.microsoft.com/playwright:v<version>-noble
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # Playwright's guidance for Chromium in a container: share the host's IPC
      # namespace, or a heavy page can crash the renderer.
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the container has the Playwright browser
        run: |
          node -e "
            const { chromium } = require('@playwright/test');
            const { version } = require('@playwright/test/package.json');
            chromium.launch().then((browser) => browser.close()).catch((error) => {
              console.error(error.message);
              console.error('::error::Update the Playwright image tag and digest in .github/workflows/ci.yml to v' + version + '.');
              process.exit(1);
            });
          "

      # The Playwright web server builds the app and serves it with `vite preview`.
      - run: pnpm test:e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy the artifact uploaded by Verify
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.verify.outputs.pages-artifact }}
