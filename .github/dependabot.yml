# Keeps the SHA-pinned actions in .github/workflows and the workspace's pnpm
# dependencies current: one grouped pull request a month for each. Every entry waits
# out a cooldown, so it proposes a version only once that is a week old (STY-087 D10,
# D12); pnpm's minimumReleaseAge (pnpm-workspace.yaml) holds the transitive versions it
# resolves beneath one for as long (CHO-031 S4).
# The cooldown does not hold back Dependabot's security updates, a repository setting
# that is on (CHO-031 S5).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # pnpm's ecosystem is npm's; the root covers every package in the workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pnpm:
        patterns: ["*"]
        # Its own pull request: a bump also needs the E2E job's image tag and digest in
        # ci.yml, which that job's check step asks for, so it cannot hold up the rest.
        exclude-patterns: ["@playwright/test"]
