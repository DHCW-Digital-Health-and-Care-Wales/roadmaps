packages:
  - apps/*

# A version more than one package uses is named once here and referenced as `catalog:`
# (ADR-016 Workspace tooling).
catalog:
  "@eslint/js": ^10.0.1
  "@types/node": ^26.6.6
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.14.0
  typescript: ~7.0.2
  typescript-eslint: ^8.72.2
  vitest: ^5.1.0

# Dependencies whose install scripts may run. lefthook's installs the Git hooks
# (lefthook.yml), and skips itself in CI.
allowBuilds:
  lefthook: true
