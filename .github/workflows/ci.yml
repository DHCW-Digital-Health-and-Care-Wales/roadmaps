# CI for pull requests and main; deploys main to GitHub Pages once every check passes
# (ADR-007). Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new PR push cancels the PR's running checks. On main a running workflow is never
  # cancelled; a newer push replaces a still-pending one, so the latest commit deploys
  # and deployments stay in commit order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Base path (build/resolve-base-path.ts): GitHub Actions sets GITHUB_REPOSITORY, so
  # every build here, E2E included, is served under /<repo>/ unless this repository
  # variable names a custom domain.
  PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the site's URL
    outputs:
      pages-artifact: ${{ steps.pages-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

      # Pages artifact, for pushes to main only. The deploy job runs no project code.
      - name: Read the Pages site configuration
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Check the build matches the Pages base path
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          expected="${PAGES_BASE_PATH}/assets/"
          if ! grep -qF "src=\"${expected}" dist/index.html; then
            echo "::error title=Base path mismatch::GitHub Pages serves this site from '${PAGES_BASE_PATH}/', but the build does not load its assets from '${expected}'. For a custom domain, set the PAGES_CUSTOM_DOMAIN repository variable (see README)."
            exit 1
          fi
      # Named per attempt: deploy-pages refuses to choose between same-named artifacts,
      # which a re-run would otherwise leave behind.
      - name: Name the Pages artifact
        id: pages-artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "name=github-pages-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: dist

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Browsers are cached per Playwright version: each version pins its own Chromium.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The Playwright web server builds the app and serves it with `vite preview`.
      - run: pnpm test:e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy the artifact uploaded by Verify
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.verify.outputs.pages-artifact }}
